<!DOCTYPE html>
<!-- Source for assets/img/og-image.png (the 1200x630 social sharing card).
     Regenerate with: node tools/render-images.js  -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  .og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; color: #fff;
    background:
      radial-gradient(900px 460px at 76% 8%, rgba(27,74,128,.6), transparent 62%),
      linear-gradient(158deg, #0f2e58 0%, #0b2545 48%, #061529 100%);
  }
  .og > * { position: relative; z-index: 2; }
  .og img { width: 210px; margin-bottom: 34px; }
  .og h1 {
    font-family: var(--font-display); font-weight: 700; color: #e7c86a;
    text-transform: uppercase; letter-spacing: .11em; font-size: 60px;
    line-height: 1.16; margin: 0;
  }
  .og .rule { width: 92px; height: 2px; background: #c9a227; margin: 26px 0; }
  .og .tag {
    font-family: var(--font-serif); font-style: italic; font-size: 32px;
    color: rgba(255,255,255,.9); margin: 0;
  }
  .og .strip {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; justify-content: center; align-items: center; gap: 26px;
    padding: 22px 0; background: rgba(6,21,41,.62);
    border-top: 1px solid rgba(231,200,106,.32);
    font-family: var(--font-display); font-weight: 700; font-size: 19px;
    letter-spacing: .13em; text-transform: uppercase; color: rgba(255,255,255,.86);
  }
  .og .strip b { color: #e7c86a; }
  .og .strip i { width: 6px; height: 6px; background: #c9a227; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="og circuitry">
  <img src="../assets/img/logo-mark.svg" alt="">
  <h1>Precision Asset<br>Transportation</h1>
  <div class="rule"></div>
  <p class="tag">White Glove Service. Unrivaled Care.</p>
  <div class="strip">
    <span>Pianos &middot; Fine Art &middot; Clocks &middot; Antiques &middot; Safes &middot; Estates</span>
    <i></i>
    <b>1-888-751-9924</b>
  </div>
</div>
</body>
</html>
